/* ===== 컴퓨터용 유리 상자 ===== */
.cbox{display:none}
.cbn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;height:26px;padding:4px 10px;border:0;background:none;color:var(--accent-d);font:inherit;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer}
.cbn::before{content:"";position:absolute;inset:-2px -8px;background:var(--accent);opacity:.4;filter:blur(9px);border-radius:50%;z-index:-1}
.cbn:disabled{opacity:.38;cursor:default}
.cbn:disabled::before{opacity:.18}
.cbn:not(:disabled):hover{transform:translateY(-1px)}
@media(min-width:821px){
 .cbox{display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:absolute;left:0;top:0;width:68px;height:168px;z-index:3}
}
.cgl{position:relative;width:56px;height:112px;flex:none}
.gp{position:absolute;inset:0;border-radius:10px;clip-path:polygon(0 0,100% 0,100% 38%,100% 43%,100% 50%,100% 57%,100% 64%,100% 72%,100% 80%,100% 88%,100% 96%,100% 100%,0 100%);transition:clip-path .5s ease}
.cbox.brk .gp{clip-path:polygon(0 0,100% 0,100% 38%,70% 43%,82% 50%,56% 57%,74% 64%,50% 72%,76% 80%,62% 88%,100% 96%,100% 100%,0 100%)}
.cgb{z-index:1;border:2px solid rgba(255,255,255,.85);background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.14) 55%,rgba(255,255,255,.34)),color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent-d) 50%,transparent),inset 0 -12px 16px color-mix(in srgb,var(--accent) 38%,transparent);backdrop-filter:blur(2px)}
.cfl{position:absolute;left:4px;right:4px;bottom:4px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent-d) 55%,#fff);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 0 color-mix(in srgb,var(--accent-d) 70%,#000);z-index:2}
.cgf{z-index:6;pointer-events:none;border:2px solid transparent;transform-origin:0 50%;transition:clip-path .5s ease,transform .6s ease,border-color .4s,box-shadow .4s;background:linear-gradient(105deg,rgba(255,255,255,0) 14%,rgba(255,255,255,.5) 18%,rgba(255,255,255,.5) 26%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 60%,rgba(255,255,255,.3) 63%,rgba(255,255,255,.3) 66%,rgba(255,255,255,0) 69%)}
.ccr{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none;color:var(--accent-d);opacity:0;transition:opacity .35s}
.cbox.brk .ccr{opacity:1}
.csh i{position:absolute;width:9px;height:9px;z-index:7;pointer-events:none;background:rgba(255,255,255,.8);clip-path:polygon(0 0,100% 30%,40% 100%);opacity:0}
.cbox.shat .csh i{animation:shd .95s ease-in var(--dl) both}
@keyframes shd{0%{opacity:0;transform:translate(0,0) rotate(0)}12%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.cbox.hit .cgl{animation:gh .36s linear}
@keyframes gh{0%,100%{left:0}20%{left:-2px}40%{left:2px}60%{left:-2px}80%{left:1px}}
.cbox.fix .cgb{animation:gfx .8s ease-out}
@keyframes gfx{0%{filter:brightness(1.7)}100%{filter:none}}
@media(prefers-reduced-motion:reduce){.cbox.hit .cgl,.cbox.fix .cgb,.cbox.shat .csh i{animation:none}}

.cgf::after{content:"";position:absolute;right:4px;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:var(--accent-d);opacity:.55}
.cbox.opn .cgf{transform:perspective(300px) rotateY(-105deg);border-color:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent-d) 45%,transparent)}

.pf{position:relative}
.wxb{position:absolute;z-index:6;width:24px;height:24px;padding:0;border:2px solid var(--accent-d);border-radius:50%;background:var(--panel);color:var(--accent-d);display:grid;place-items:center;cursor:pointer}
.wxb svg{width:14px;height:14px}
.wxb.unset::after{content:"";position:absolute;top:-1px;right:-1px;width:6px;height:6px;border-radius:50%;background:#e53935;box-shadow:0 0 4px rgba(229,57,53,.85);animation:wxbl 1.1s ease-in-out infinite}
@keyframes wxbl{0%,100%{opacity:1}50%{opacity:.12}}
.wxm{position:absolute;z-index:60;display:flex;gap:4px;padding:6px;background:var(--panel);border:2px dotted var(--accent-d);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.wxm[hidden]{display:none}
.wxm button{display:grid;justify-items:center;gap:2px;width:44px;padding:4px 0;border:1px solid transparent;border-radius:8px;background:none;color:var(--accent-d);font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.wxm button svg{width:20px;height:20px}
.wxm button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:var(--accent-d)}
#wfx{position:absolute;left:0;top:0;width:272px;height:160px;image-rendering:pixelated;pointer-events:none;z-index:4}
.wdim{position:absolute;inset:0;pointer-events:none;z-index:3;transition:background .4s}
.wdim.cloud{background:radial-gradient(ellipse closest-side at 50% 52%,rgba(70,82,105,.2) 55%,rgba(70,82,105,0) 100%)}

/* ===== 로그인 · 친구 기능 ===== */
.gate{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#e0f3fd,#fafdff 70%);overflow:auto}
.gate[hidden]{display:none}
.gate-card{width:min(360px,100%);padding:26px 22px 20px;border:3px dotted var(--accent-d);border-radius:22px;background:#fff;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--accent);text-align:center;display:grid;gap:12px;justify-items:center}
.gate-card canvas{width:80px;height:80px;image-rendering:pixelated}
.gate-card h1{margin:0;font-size:22px;color:#3a5a8c}
.gate-card p{margin:0;font-size:13px;line-height:1.5;color:#5b7090}
.gate-btns{display:grid;gap:8px;width:100%}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px 14px;border:1px solid #cfd8e3;border-radius:12px;background:#fff;color:#3a4558;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.gbtn:hover{background:#f6fafe}
.gbtn.alt{border-color:var(--accent-d);color:var(--accent-d)}
.gbtn svg{width:18px;height:18px}
.gate-note{font-size:11px;color:#8a9ab0;line-height:1.5}
.demob{display:inline-block;padding:2px 8px;border-radius:999px;background:#fff3c9;color:#8a6a10;font-size:11px;font-weight:700}

.skin>.acct{position:absolute;right:16px;bottom:6px;z-index:5;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mute)}
.acct[hidden]{display:none}
.acct button{border:0;background:none;padding:0;color:var(--accent-d);font:inherit;font-size:10px;font-weight:700;text-decoration:underline;cursor:pointer}

.gbb{position:relative;display:inline-flex;align-items:center;justify-content:center;height:18px;margin-left:2px;padding:0 8px;line-height:1;text-align:center;border:1px solid var(--accent-d);border-radius:999px;background:var(--panel);color:var(--accent-d);font:inherit;font-size:10px;font-weight:700;cursor:pointer}
.wxb.dot::after,.gbb.dot::after{content:"";position:absolute;top:-1px;right:-1px;width:6px;height:6px;border-radius:50%;background:#e53935;box-shadow:0 0 4px rgba(229,57,53,.85);animation:wxbl 1.1s ease-in-out infinite}
.gbb.dot::after{top:-2px;right:-2px}
.fbtn .plus{font-size:17px;font-weight:700;line-height:1;margin-top:-2px}

.fpop{position:absolute;z-index:60;width:min(340px,calc(100vw - 16px));max-height:70vh;overflow:auto;padding:10px;background:var(--panel);border:2px dotted var(--accent-d);border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.22);font-size:12px;color:var(--ink)}
.fpop[hidden]{display:none}
.fpop h4{margin:10px 0 4px;font-size:11px;color:var(--mute);font-weight:700}
.fp-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.fp-s{display:flex;gap:4px;flex:1;min-width:0}
.fp-s input{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--accent-d);border-radius:8px;font-size:12px;letter-spacing:.5px;text-transform:uppercase}

.fp-tg{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 2px}

.fp-tg button,.fp-btn{padding:3px 8px;border:1px solid var(--accent-d);border-radius:999px;background:var(--panel);color:var(--accent-d);font:inherit;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.fp-tg button[aria-pressed=true],.fp-btn.on{background:var(--accent);color:var(--accent-ink)}

var LEAF="M12 12C7 9 6 4 9 2.5C10.5 1.8 11.7 3 12 4.2C12.3 3 13.5 1.8 15 2.5C18 4 17 9 12 12Z";

 if(r>0){h+='<defs><linearGradient id="g'+s+'" gradientUnits="userSpaceOnUse" x1="0" y1="22.2" x2="0" y2="1.8"><stop offset="0" class="g1"/><stop offset="1" class="g2"/></linearGradient>';
  if(r<1)h+='<linearGradient id="mg'+s+'" gradientUnits="userSpaceOnUse" x1="0" y1="'+(top+3.5)+'" x2="0" y2="'+(top-3.5)+'"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient><mask id="m'+s+'" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="url(#mg'+s+')"/></mask>';
  h+='</defs><g'+(r<1?' mask="url(#m'+s+')"':'')+' fill="url(#g'+s+')">'+leaves(4,"cl-f")+'</g>'}

  case "send_request":if(a.p_to===VFID){if(!v.blk&&!v.on)vfAdd();return "accepted"}return undefined;
  case "friend_view":case "get_profile":if(a.p_id===VFID)return v.avail||v.on?vfView():null;return undefined;

  case "cancel_request":if(a.p_to===VFID)return null;return undefined;
  case "like_user":if(a.p_to===VFID){if(v.likedDay===kst())return "already";v.likedDay=kst();saveProf();return "ok"}return undefined;
  case "submit_report":if(a.p_target===VFID)return null;return undefined;
  case "guestbook_list":if(a.p_owner===VFID)return v.posts.slice().reverse().map(function(p){return {id:p.id,body:p.body,is_public:p.is_public,archived:false,unread:false,created_at:p.created_at,mine:true,author:{id:ME?ME.id:"me",name:prof.name||"나",pub:pubOf(prof)}}});return undefined;

  case "guestbook_delete":if(a.p_id>=VFN){v.inbox=v.inbox.filter(function(x){return x.id!==a.p_id});v.posts=v.posts.filter(function(x){return x.id!==a.p_id});saveProf();return null}return undefined;

 return undefined}
function vfMerge(name,a,r){var v=vfS();

 else if(name==="recommend_users"){r=r||[];if(v.avail&&!v.on)r=[vfLite()].concat(r)}

 else if(name==="unread_counts"){r=Object.assign({},r||{});r.guestbook=(r.guestbook||0)+v.inbox.filter(function(x){return x.unread}).length;r.likes=(r.likes||0)+(v.on&&v.likedMe&&v.likedMe.unread?1:0)}

/* ---------- 보안: 다른 사람이 보낸 공개 정보(pub)는 모양을 검사해서 쓴다 ---------- */
var PH_RE=/^data:image\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/,ID_RE=/^[A-Za-z0-9_-]{1,32}$/,DT_RE=/^\d{4}-\d{2}-\d{2}$/;
function cleanPub(p){var o={};if(!p||typeof p!=="object"||Array.isArray(p))return o;
 ["theme","hair","hs","fe","od","oc","pd","sk","bc","wallS","wallC","floorS","floorC"].forEach(function(k){var v=p[k];if(typeof v==="number"&&isFinite(v)&&v>=0&&v<=999&&v===Math.floor(v))o[k]=v});
 ["name","bio","mood","song","dlabel"].forEach(function(k){var v=p[k];if(typeof v==="string"&&v.length<=200)o[k]=v});
 if(typeof p.ddate==="string"&&(p.ddate===""||DT_RE.test(p.ddate)))o.ddate=p.ddate;
 if(typeof p.photo==="string"&&p.photo.length<=140000&&PH_RE.test(p.photo))o.photo=p.photo;
 if(p.wx&&typeof p.wx==="object"&&typeof p.wx.d==="string"&&typeof p.wx.k==="string"&&DT_RE.test(p.wx.d)&&/^[a-z]{1,12}$/.test(p.wx.k))o.wx={d:p.wx.d,k:p.wx.k};
 if(Array.isArray(p.furn)&&p.furn.length<=64&&p.furn.every(function(x){return typeof x==="string"&&ID_RE.test(x)}))o.furn=p.furn.slice();
 if(p.fpos&&typeof p.fpos==="object"&&!Array.isArray(p.fpos)){var kp=Object.keys(p.fpos);if(kp.length<=64&&kp.every(function(k){var a=p.fpos[k];return ID_RE.test(k)&&Array.isArray(a)&&a.length===2&&a.every(function(n){return typeof n==="number"&&isFinite(n)})})){o.fpos={};kp.forEach(function(k){o.fpos[k]=[p.fpos[k][0],p.fpos[k][1]]})}}
 if(p.fcol&&typeof p.fcol==="object"&&!Array.isArray(p.fcol)){var kc=Object.keys(p.fcol);if(kc.length<=64&&kc.every(function(k){return ID_RE.test(k)&&typeof p.fcol[k]==="number"&&isFinite(p.fcol[k])})){o.fcol={};kc.forEach(function(k){o.fcol[k]=p.fcol[k]})}}
 return o}

 return x}
